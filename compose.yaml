      SPRING_MONGODB_URI: mongodb://mongo:27017/audit_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

volumes:
  mysql-data:
  postgres-data:
  mongo-data:
  kafka-data: