server.port=8081
spring.application.name=auth-service

# ==========================================
# DATABASE CONFIGURATION
# ==========================================
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/auth_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_ROOT_PASSWORD:user@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# HIKARICP CONNECTION POOL
# ==========================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000```properties
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==========================================
# JWT CONFIGURATION
# ==========================================
securepay.jwt.secret=${SECUREPAY_JWT_SECRET}
securepay.jwt.access-token-minutes=15
securepay.jwt.issuer=securepay-auth

# ==========================================
# EUREKA CONFIGURATION
# ==========================================
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true

# ==========================================
# LOGGING
# ==========================================
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.orm.jdbc.error=WARN