server.port=8090
spring.application.name=settlement-service

# PostgreSQL (compose container is published on host port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/settlement_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update

# Overridden by PAYMENT_SERVICE_URL in compose
payment.service.url=http://localhost:8085

# Kafka (host listener for the compose broker is 29092)
spring.kafka.bootstrap-servers=localhost:29092

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/